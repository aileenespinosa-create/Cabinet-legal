name: Aplicar cambios de Claude
on:
  push:
    branches: [subir-cambios]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publicar cambios
        run: |
          git config user.name "Cabinet Legal"
          git config user.email "info@cabinetlegal.com.do"
          git fetch origin main
          if ls .github/workflows/*.b64 >/dev/null 2>&1; then
            P=$(ls .github/workflows/*.b64 | head -1)
            BR=$(basename "$P" .b64 | sed 's#--#/#')
            base64 -d "$P" | gunzip > /tmp/cambios.patch
            git checkout -b "$BR" origin/main
            git am /tmp/cambios.patch
          else
            B=$(ls .github/workflows/*.bundle | head -1)
            BR=$(git bundle list-heads "$B" | awk '{print $2}' | sed 's#refs/heads/##' | head -1)
            git fetch "$B" "$BR:$BR"
          fi
          git log --oneline -1 "$BR"
          git push origin "$BR"
      - name: Borrar la rama temporal
        run: git push origin --delete subir-cambios
